---
layout: default
---
<article class="article">
  <a class="back" href="{{ '/#writing' | relative_url }}">← All writing</a>
  <h1>{{ page.title }}</h1>
  <div class="article-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    <span>{{ content | number_of_words | divided_by: 200 | plus: 1 }} min read</span>
    {% for tag in page.tags %}<span class="tag">#{{ tag }}</span>{% endfor %}
  </div>
  {% if page.image %}
  <img class="cover" src="{{ page.image | relative_url }}" alt="">
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>

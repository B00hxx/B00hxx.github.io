<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="wordmark" href="{{ '/' | relative_url }}">Baha Riahi</a>
      <nav class="nav" aria-label="Main">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#experience' | relative_url }}">Experience</a>
        <a href="{{ '/#writing' | relative_url }}">Writing</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap"><div class="inner">
      <span>© {{ 'now' | date: '%Y' }} {{ site.author }}</span>
      <nav aria-label="Elsewhere">
        <a href="https://github.com/{{ site.github }}">GitHub</a>
        {% if site.linkedin != "" %}<a href="https://www.linkedin.com/in/{{ site.linkedin }}">LinkedIn</a>{% endif %}
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </div></div>
  </footer>
</body>
</html>

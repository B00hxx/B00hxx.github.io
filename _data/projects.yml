- name: "Swipy News: an AI-summarised news app"
  when: "2026"
  description: "A Flutter mobile app that turns the news into a swipeable card deck: swipe one way to read the full story, the other to skip, and bookmark what you want to keep. A Python pipeline pulls headlines from NewsAPI and condenses each one into three bullet points with GPT-4o-mini. It deduplicates articles by URL hash before writing them to Firestore. Firebase Auth provides per-user saved libraries."


- name: "Semantic caching middleware for LLM apps"
  when: "2026 · Elyadata internship"
  description: "A Python library that sits between users and an LLM and serves stored answers to questions that mean the same thing, even when they're worded differently. Redis Stack with an HNSW index for fast lookups, PostgreSQL + pgvector as the durable tier, PII masking with Presidio, six pluggable invalidation and eviction policies, and Prometheus/Grafana observability. The similarity threshold was tuned on labelled data rather than picked by feel."
  link: "/blog/2026/semantic-caching/"
  repo: "https://github.com/B00hxx/semantic_caching"
  image: "/assets/img/posts/semantic-caching/cover.png"

- name: "Malware detection from dynamic API call sequences"
  when: "2026 · Sup'Com P2M"
  description: "Classifies Windows executables as malware or goodware from the first 100 API calls they make in a sandbox (43,876 samples, only 2.5% goodware). About 70% of the dataset's rows are exact duplicates, so I built a deduplicated evaluation protocol and showed that the usual random split overstates MCC by about 0.1. Four PyTorch models (BiLSTM, Transformer, 1D-CNN and a GATv2 network over API-transition graphs) are benchmarked against n-gram baselines over 5 seeds; a hybrid ensemble comes out on top with 0.832 MCC and 0.990 ROC-AUC. Served by a FastAPI service with per-call explanations. Built with Mohamed Aziz Merichkou, supervised by Prof. Slim Rekhis (CN&S Lab)."
  link: "/blog/2026/malware-api-calls/"
  repo: "https://github.com/B00hxx/DL_Malware_Classifier"
  image: "/assets/img/posts/malware-api-calls/cover.png"

- name: "AthenaAI: a local RAG study companion"
  when: "2025, rebuilt 2026"
  description: "Upload a PDF, ask it questions and get answers that cite the exact page and section they came from, or turn it into flashcards, with everything running on a local LLM (Gemma 7B via Ollama). Marker converts PDFs to Markdown with layout detection and OCR; passages are split along page and heading boundaries, embedded with MiniLM and indexed in ChromaDB. Answers stream token by token. Ingestion runs as a queue of isolated parser processes that can be cancelled, timed out and resumed after a restart. FastAPI, PostgreSQL, React, Docker Compose with a GPU override, and 110 backend tests."
  link: "/blog/2026/athena-rag/"
  repo: "https://github.com/B00hxx/Athena_AI"
  image: "/assets/img/posts/athena-rag/cover.png"

